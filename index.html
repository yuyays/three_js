<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Modern ThreeJS ⚡️</title>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<style>
  body {
    overflow: hidden;
    margin: 0;
    touch-action: none;
  }
  canvas {
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    outline: none;
  }
</style>

<div id="ui-controls">
  <button id="create-box-btn" title="Create New Box">
    <span>+</span> New Box
  </button>
</div>

<style>
  #ui-controls {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    gap: 10px;
  }
  
  #create-box-btn {
    background-color: rgba(60, 60, 60, 0.7);
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 8px;
    padding: 8px 15px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.2s ease;
  }
  
  #create-box-btn:hover {
    background-color: rgba(80, 80, 80, 0.8);
    transform: scale(1.05);
  }
  
  #create-box-btn span {
    font-size: 20px;
  }
</style>
